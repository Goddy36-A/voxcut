name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Download FFmpeg (bundled so the app works fully offline)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName bin\ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") bin\ffprobe.exe
          bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Test engine and GUI
        run: |
          python tests/test_engine.py
          python tests/test_matting.py
          python tests/test_gui.py
          python tests/test_cloud.py
          python tests/test_maker.py
          python tests/test_recorder.py
          python tests/test_lecture.py
          python tests/test_windows_capture.py
          python tests/test_board_ai.py
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name IdeawoodStudio `
            --icon assets\icon.ico --add-data "assets;assets" --add-data "models;models" `
            --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\ffprobe.exe;bin" `
            --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets `
            --collect-all onnxruntime `
            main.py
          Copy-Item dist\IdeawoodStudio.exe "dist\IdeawoodStudio-${{ github.ref_name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: IdeawoodStudio-windows
          path: dist/IdeawoodStudio.exe

      - name: Release notes from CHANGELOG (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## " + [regex]::Escape($ver) + " .*?(?=^## |\z)")
          if ($m.Success) { $m.Value | Set-Content notes.md -Encoding utf8 } else { "Release $ver" | Set-Content notes.md }
          Get-Content notes.md

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ideawood Studio ${{ github.ref_name }}
          body_path: notes.md
          files: dist/IdeawoodStudio-${{ github.ref_name }}.exe
