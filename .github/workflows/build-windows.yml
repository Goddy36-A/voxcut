name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Download FFmpeg (bundled so the app works fully offline)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName bin\ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") bin\ffprobe.exe
          bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Test engine
        run: python tests/test_engine.py
        env:
          PATH: ${{ github.workspace }}\bin;${{ env.PATH }}

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed --name VoxCut
          --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\ffprobe.exe;bin"
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: VoxCut-windows
          path: dist/VoxCut.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoxCut.exe
